<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#fff}svg{max-width:100%;height:auto}</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <!-- Green gradient for TB Clover -->
    <linearGradient id="cloverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <style>
    <![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;700&display=swap');
    .title {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      font-size: 48px;
      font-weight: 700;
      fill: #f8fafc;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      font-size: 16px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .item-en {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    .item-zh {
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 13px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .item-num {
      font-family: 'Inter', sans-serif;
      font-size: 18px;
      font-weight: 700;
      fill: url(#accentGrad);
    }
    .card {
      fill: url(#cardGrad);
      stroke: #334155;
      stroke-width: 1;
      transition: all 0.3s ease;
      filter: url(#shadow);
    }
    .card-group:hover .card {
      stroke: url(#accentGrad);
      stroke-width: 2;
      filter: url(#glow);
      transform: translateY(-2px);
    }
    .card-group:hover .icon {
      transform: scale(1.1);
    }
    .icon {
      transition: transform 0.3s ease;
      transform-origin: center;
    }
    .tb-text {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 700;
      fill: url(#cloverGrad);
      letter-spacing: 0.5px;
    }
    .grid-line {
      stroke: #1e293b;
      stroke-width: 1;
      stroke-dasharray: 4 4;
    }
    ]]>
  </style>
  
  <rect width="1200" height="1600" fill="url(#bgGrad)"/>
  
  <!-- Green TB Clover Logo - Top Right -->
  <g transform="translate(1080, 35)">
    <!-- 3 clover leaves -->
    <circle cx="0" cy="-8" r="8" fill="url(#cloverGrad)"/>
    <circle cx="-8" cy="0" r="8" fill="url(#cloverGrad)"/>
    <circle cx="8" cy="0" r="8" fill="url(#cloverGrad)"/>
    <!-- Stem -->
    <path d="M0 8 L3 18 L0 16 L-3 18 Z" fill="url(#cloverGrad)"/>
    <!-- Green TB text -->
    <text x="0" y="35" text-anchor="middle" class="tb-text">TB</text>
  </g>

    <path d="M700 0 V1600" class="grid-line"/>
